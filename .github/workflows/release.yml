# Builds both TV apps and publishes a GitHub release when a vMAJOR.MINOR.PATCH tag is pushed (docs/release.md):
# - Samsung: an unsigned YouPipe-TV-v<version>-samsung.wgt. Samsung TVs only install packages signed with a
#   certificate made for each TV, so users sign it themselves (site/index.html, docs/testing.md).
# - Android TV: YouPipe-TV-v<version>-android.apk (every ABI) and one APK per ABI.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        name: Read the version from the tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not in the form vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

  samsung:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samsung
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: samsung/package-lock.json

      - name: Install (vendors Shaka Player, hls.js and Roboto into app/lib)
        run: npm ci

      - name: Test
        run: npm test

      - name: Set the version
        run: |
          sed -i -E "s/(<widget [^>]*version=\")[0-9.]+(\")/\1$VERSION\2/" app/config.xml
          sed -i -E "s/(<meta name=\"yp-version\" content=\")[^\"]*(\")/\1$VERSION\2/" app/index.html
          grep -o 'version="[0-9.]*"' app/config.xml | head -1

      - name: Package the unsigned .wgt
        run: |
          mkdir -p ../dist
          cd app
          zip -r -X "../../dist/YouPipe-TV-v$VERSION-samsung.wgt" . -x '.buildResult/*' '.project' '.tproject' '*signature*.xml'

      - uses: actions/upload-artifact@v5
        with:
          name: samsung
          path: dist/*.wgt

  android:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      - name: Decode the signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # With the secrets (docs/release.md), every release is signed with the same key, so updates install over
          # the old version. Without them the APKs are signed with a throwaway debug key: they install, but each
          # release then needs the previous one uninstalled first.
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: signing with a debug key"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          args=(--release --build-name="$VERSION" --build-number="${{ github.run_number }}" --dart-define=APP_VERSION="$VERSION")
          mkdir -p ../dist
          flutter build apk "${args[@]}"
          cp build/app/outputs/flutter-apk/app-release.apk "../dist/YouPipe-TV-v$VERSION-android.apk"
          flutter build apk "${args[@]}" --split-per-abi
          for abi in arm64-v8a armeabi-v7a; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "../dist/YouPipe-TV-v$VERSION-$abi.apk"
          done

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v5
        with:
          name: android
          path: dist/*.apk

  release:
    needs: [version, samsung, android]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and tags, for the release notes

      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: Write the release notes
        run: |
          # What changed since the last release, from commit subjects ("(#12)" PR suffixes dropped).
          previous=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          changes=""
          if [[ -n "$previous" ]] && git rev-parse -q --verify "refs/tags/$previous" >/dev/null; then
            changes=$(git log --no-merges --format='- %s' "$previous..$GITHUB_REF_NAME" | sed -E 's/ \(#[0-9]+\)$//')
          fi
          {
            echo "## What's new"
            echo
            echo "${changes:-- Bug fixes and improvements}"
            echo
            echo "## Install"
            echo
            echo "- **Android TV / Google TV:** \`YouPipe-TV-v$VERSION-android.apk\` works on every TV. The \`arm64-v8a\` and \`armeabi-v7a\` APKs are smaller; some TVs run 32-bit Android and need \`armeabi-v7a\`."
            echo "- **Samsung (2023 and later):** \`YouPipe-TV-v$VERSION-samsung.wgt\`, signed with your own Samsung certificate and installed in Developer Mode."
            echo
            echo "Step-by-step guides: https://sanusanal.github.io/YouPipe-TV/#install"
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish the release
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "YouPipe TV $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
