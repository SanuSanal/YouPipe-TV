# Checks both apps on every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  samsung:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samsung
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: samsung/package-lock.json
      - run: npm ci
      - run: npm test

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: true
      - run: flutter pub get
      - run: dart format -l 120 --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
